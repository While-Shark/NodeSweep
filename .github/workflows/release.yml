name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci && npm run build
        working-directory: web
      - run: go test -race ./... && go vet ./...
      - name: Build portable archives
        shell: bash
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            folder="release/nodesweep-linux-$arch"
            mkdir -p "$folder/deploy"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "$folder/nodesweep" ./cmd/nodesweep
            cp install.sh README.md LICENSE "$folder/"
            cp deploy/nodesweep.service "$folder/deploy/"
            tar -C "$folder" -czf "release/nodesweep-linux-$arch.tar.gz" .
          done
          cd release
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/SHA256SUMS --verify-tag --generate-notes "${args[@]}"
